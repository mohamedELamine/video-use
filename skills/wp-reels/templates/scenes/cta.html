<!doctype html>
<html lang="{{lang}}">
  <head><meta charset="UTF-8" /><title>{{id}}</title></head>
  <body>
    <template>
      <style>
        {{fontface}}
        #root { position: absolute; inset: 0; direction: {{dir}}; font-family: "{{font}}", system-ui, sans-serif; color: {{fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 90px 220px; text-align: center; }
        .card { width: 900px; border-radius: 40px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.12); backdrop-filter: blur(20px); padding: 80px 60px 70px; box-shadow: 0 50px 120px rgba(0,0,0,.45); will-change: transform; }
        .mark { display: block; width: 520px; margin: 0 auto 48px; }
        .mark[src=""] { display: none; }
        .h { font-weight: 800; font-size: 86px; line-height: 1.25; }
        .w { display: inline-block; margin: 0 8px; }
        .accent { color: {{accent}}; }
        .btnwrap { position: relative; display: inline-block; overflow: hidden; border-radius: 999px; margin-top: 56px; }
        .btn { display: inline-block; font-weight: 800; font-size: 44px; color: {{bg}}; background: {{accent}}; border-radius: 999px; padding: 22px 70px; box-shadow: 0 20px 50px color-mix(in srgb, {{accent}} 45%, transparent); will-change: transform; }
        .shine { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.35) 50%, transparent 60%); pointer-events: none; }
      </style>
      <div id="root" data-composition-id="{{id}}" data-width="{{width}}" data-height="{{height}}">
        <div class="card">
          <img class="mark" src="{{logo}}" alt="" />
          <div class="h"><span class="words">{{headline}}</span> <span class="words accent">{{headline_accent}}</span></div>
          <div class="btnwrap" data-layout-allow-overflow><div class="btn">{{button}}</div><div class="shine" data-layout-allow-overflow></div></div>
        </div>
      </div>
      <script>
        (function () {
          var S = '[data-composition-id="{{id}}"] ';
          document.querySelectorAll(S + ".words").forEach(function (el) {
            var words = el.textContent.trim().split(/\s+/).filter(Boolean); el.textContent = "";
            words.forEach(function (w) { var s = document.createElement("span"); s.className = "w"; s.textContent = w; el.appendChild(s); });
          });
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(S + ".card", { opacity: 0, y: 90, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.4)" }, 0);
          tl.fromTo(S + ".mark", { opacity: 0, scale: 0.8, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0.25);
          tl.fromTo(S + ".h .w", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: 0.1 }, 0.6);
          tl.fromTo(S + ".btnwrap", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 1.15);
          tl.fromTo(S + ".shine", { xPercent: -120 }, { xPercent: 120, duration: 0.9, ease: "power2.inOut" }, 1.8);
          tl.to(S + ".btn", { scale: 0.94, duration: 0.12, ease: "power2.in" }, 2.6);
          tl.to(S + ".btn", { scale: 1, duration: 0.35, ease: "back.out(3)" }, 2.72);
          window.__timelines["{{id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
