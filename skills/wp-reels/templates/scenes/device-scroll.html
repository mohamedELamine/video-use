<!doctype html>
<html lang="{{lang}}">
  <head><meta charset="UTF-8" /><title>{{id}}</title></head>
  <body>
    <template>
      <style>
        {{fontface}}
        #root { position: absolute; inset: 0; direction: {{dir}}; font-family: "{{font}}", system-ui, sans-serif; color: {{fg}}; overflow: hidden; }
        .stage { position: absolute; inset: 0; perspective: 1800px; perspective-origin: 50% 40%; }
        .callout { position: absolute; top: 250px; left: 0; right: 0; text-align: center; z-index: 3; }
        .callout .w { display: inline-block; font-weight: 800; font-size: 92px; line-height: 1.2; margin: 0 8px; text-shadow: 0 10px 40px rgba(0,0,0,.45); }
        .accent { color: {{accent}}; }
        .browser { position: absolute; left: 60px; top: 470px; width: 960px; height: 1200px; border-radius: 30px; background: #fff; overflow: hidden; transform-style: preserve-3d; box-shadow: 0 60px 140px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.08); will-change: transform; }
        .chrome { height: 58px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 10px; padding: 0 22px; direction: ltr; }
        .chrome i { width: 14px; height: 14px; border-radius: 50%; display: block; }
        .chrome .url { margin-left: 18px; flex: 1; height: 30px; border-radius: 8px; background: #fff; border: 1px solid #e5e7eb; font: 700 16px/30px system-ui; color: #4b5563; padding: 0 14px; }
        .viewport { position: absolute; top: 58px; left: 0; right: 0; bottom: 0; overflow: hidden; }
        .page { position: absolute; top: 0; left: 0; width: 960px; display: block; will-change: transform; }
        .glow { position: absolute; left: 140px; top: 900px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, {{accent}} 35%, transparent) 0%, transparent 65%); filter: blur(40px); }
      </style>
      <div id="root" data-composition-id="{{id}}" data-width="{{width}}" data-height="{{height}}">
        <div class="glow"></div>
        <div class="callout"><span class="words">{{callout}}</span> <span class="words accent">{{callout_accent}}</span></div>
        <div class="stage">
          <div class="browser">
            <div class="chrome"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><div class="url">{{url_label}}</div></div>
            <div class="viewport"><img class="page" src="{{screenshot}}" alt="" data-layout-allow-overflow /></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var S = '[data-composition-id="{{id}}"] ';
          document.querySelectorAll(S + ".words").forEach(function (el) {
            var words = el.textContent.trim().split(/\s+/).filter(Boolean); el.textContent = "";
            words.forEach(function (w) { var s = document.createElement("span"); s.className = "w"; s.textContent = w; el.appendChild(s); });
          });
          var D = {{duration}};
          var img = document.querySelector(S + ".page");
          function build() {
            var pageH = img.naturalHeight * (960 / img.naturalWidth);
            var scrollDist = Math.max(0, Math.round(pageH) - 1142);
            var scrollSecs = Math.max(1.5, D - 1.7);
            var tl = gsap.timeline({ paused: true });
            tl.fromTo(S + ".browser", { opacity: 0, y: 160, scale: 0.9, rotateY: -22, rotateX: 10 },
              { opacity: 1, y: 0, scale: 1, rotateY: -9, rotateX: 5, duration: 1.0, ease: "power3.out" }, 0);
            tl.fromTo(S + ".callout .w", { opacity: 0, y: 40, filter: "blur(16px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", stagger: 0.09 }, 0.45);
            tl.fromTo(S + ".page", { y: 0 }, { y: -scrollDist, duration: scrollSecs, ease: "power2.inOut" }, 0.9);
            tl.to(S + ".browser", { rotateY: -4, rotateX: 2, duration: scrollSecs, ease: "sine.inOut" }, 1.0);
            tl.to(S + ".browser", { opacity: 0, y: -80, scale: 0.96, duration: 0.4, ease: "power2.in" }, D - 0.4);
            tl.to(S + ".callout .w", { opacity: 0, y: -30, filter: "blur(10px)", duration: 0.3, ease: "power2.in", stagger: 0.03 }, D - 0.4);
            window.__timelines["{{id}}"] = tl;
          }
          if (img.complete && img.naturalWidth) build(); else img.decode().then(build, build);
        })();
      </script>
    </template>
  </body>
</html>
